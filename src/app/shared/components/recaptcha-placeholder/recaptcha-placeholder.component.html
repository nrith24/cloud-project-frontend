<div class="flex w-full max-w-[300px] items-center gap-3 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
  <button
    type="button"
    (click)="toggle()"
    class="flex h-6 w-6 shrink-0 items-center justify-center rounded border-2 transition-colors"
    [class.border-slate-300]="!checked()"
    [class.bg-white]="!checked()"
    [class.border-accent-500]="checked()"
    [class.bg-accent-500]="checked()"
  >
    @if (verifying()) {
      <svg class="h-3.5 w-3.5 animate-spin text-primary-500" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    } @else if (checked()) {
      <svg class="h-3.5 w-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    }
  </button>
  <span class="text-sm text-slate-600">I'm not a robot</span>
  <div class="ml-auto flex flex-col items-center opacity-40">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>
    <span class="text-[9px] font-medium">reCAPTCHA</span>
  </div>
</div>
