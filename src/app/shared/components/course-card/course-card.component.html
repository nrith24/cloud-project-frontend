<article class="card group flex flex-col overflow-hidden">
  <div class="relative aspect-[16/10] overflow-hidden bg-slate-100">
    <img [src]="course.thumbnail" [alt]="course.title" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" />
    <span class="absolute left-3 top-3 rounded-full px-2.5 py-1 text-xs font-semibold {{ categoryColors[course.category] }}">
      {{ course.category }}
    </span>
  </div>

  <div class="flex flex-1 flex-col p-5">
    <h3 class="line-clamp-2 font-display text-base font-semibold text-slate-900">{{ course.title }}</h3>
    <p class="mt-1 text-sm text-slate-500">{{ course.instructor }}</p>

    <div class="mt-3 flex items-center gap-3 text-xs text-slate-500">
      <span class="flex items-center gap-1 font-medium text-amber-500">
        <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20"><path d="M10 1l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L10 15l-5.6 3.1 1.4-6.3L1 8.5l6.4-.6L10 1z"/></svg>
        {{ course.rating }}
      </span>
      <span>&bull;</span>
      <span>{{ course.durationHours }}h</span>
      <span>&bull;</span>
      <span>{{ course.level }}</span>
    </div>

    @if (showProgress && enrolled) {
      <div class="mt-4">
        <div class="mb-1.5 flex items-center justify-between text-xs font-medium text-slate-500">
          <span>{{ enrolled.progress }}% complete</span>
          <span>{{ enrolled.lastAccessed }}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" [style.width.%]="enrolled.progress"></div></div>
        <a routerLink="/dashboard" class="btn-primary mt-4 w-full !py-2.5 text-sm">Continue Learning</a>
      </div>
    } @else {
      <div class="mt-4 flex flex-1 items-end justify-between">
        <span class="font-display text-lg font-bold text-slate-900">{{ '$' + course.price }}</span>
        <a routerLink="/register" class="btn-secondary !px-4 !py-2 text-sm">Enroll</a>
      </div>
    }
  </div>
</article>
