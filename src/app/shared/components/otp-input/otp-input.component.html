<div class="flex justify-center gap-2.5 sm:gap-3" (paste)="onPaste($event)">
  @for (i of boxes; track i) {
    <input
      #digit
      type="text"
      inputmode="numeric"
      maxlength="1"
      autocomplete="one-time-code"
      class="h-12 w-11 rounded-xl border text-center font-display text-xl font-semibold text-slate-800 outline-none transition-all duration-150 focus:ring-4 sm:h-14 sm:w-13"
      [class.border-slate-200]="!hasError"
      [class.focus:border-primary-500]="!hasError"
      [class.focus:ring-primary-500/10]="!hasError"
      [class.border-red-400]="hasError"
      [class.focus:ring-red-500/10]="hasError"
      (input)="onInput(i, $event)"
      (keydown)="onKeydown(i, $event)"
    />
  }
</div>
